<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00D1FF"/>
      <stop offset="100%" stop-color="#8F66FF"/>
    </linearGradient>
    <linearGradient id="gText" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00D1FF"/>
      <stop offset="100%" stop-color="#8F66FF"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- ── Icon box ── -->
  <rect x="0" y="0" width="64" height="64" rx="12" fill="#151619"/>
  <line x1="0" y1="32" x2="64" y2="32" stroke="#00D1FF" stroke-width="0.4" opacity="0.12"/>
  <line x1="32" y1="0" x2="32" y2="64" stroke="#00D1FF" stroke-width="0.4" opacity="0.12"/>
  <rect x="0" y="0" width="64" height="64" rx="12" fill="none" stroke="url(#g)" stroke-width="1.5" opacity="0.6"/>

  <!-- "404" inside icon -->
  <text x="32" y="41"
        font-family="'Arial Black', 'Arial', sans-serif"
        font-size="24" font-weight="900"
        fill="url(#g)"
        text-anchor="middle"
        filter="url(#glow)">404</text>

  <!-- ── Text part ── -->

  <!-- "404" in big -->
  <text x="80" y="36"
        font-family="'Arial Black', 'Arial', sans-serif"
        font-size="28" font-weight="900"
        fill="url(#gText)"
        filter="url(#glow)">404</text>

  <!-- "Tweaks" right after in white -->
  <text x="142" y="36"
        font-family="'Arial Black', 'Arial', sans-serif"
        font-size="28" font-weight="900"
        fill="#EDF2F7">Tweaks</text>

  <!-- Subtitle "FORTNITE OPTIMIZER" -->
  <text x="81" y="52"
        font-family="'Arial', sans-serif"
        font-size="10" font-weight="400"
        fill="#8F99AD"
        letter-spacing="3">FORTNITE OPTIMIZER</text>

  <!-- Accent line under subtitle -->
  <line x1="81" y1="56" x2="200" y2="56" stroke="url(#gText)" stroke-width="1" opacity="0.4"/>
</svg>
