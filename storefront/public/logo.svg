<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 56">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#deff9a"/>
      <stop offset="100%" stop-color="#b8e84a"/>
    </linearGradient>
    <linearGradient id="gH" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#deff9a"/>
      <stop offset="100%" stop-color="#b8e84a"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Icon box -->
  <rect x="0" y="0" width="56" height="56" rx="10" fill="#0a0a0a"/>
  <line x1="0" y1="28" x2="56" y2="28" stroke="#deff9a" stroke-width="0.4" opacity="0.1"/>
  <line x1="28" y1="0" x2="28" y2="56" stroke="#deff9a" stroke-width="0.4" opacity="0.1"/>
  <rect x="0" y="0" width="56" height="56" rx="10" fill="none" stroke="rgba(222,255,154,0.35)" stroke-width="1.5"/>
  <text x="28" y="36"
        font-family="'Arial Black', 'Arial', sans-serif"
        font-size="21" font-weight="900"
        fill="url(#g)"
        text-anchor="middle"
        filter="url(#glow)">404</text>

  <!-- "404" text -->
  <text x="70" y="32"
        font-family="'Arial Black', 'Arial', sans-serif"
        font-size="26" font-weight="900"
        fill="url(#gH)"
        filter="url(#glow)">404</text>

  <!-- "Tweaks" text -->
  <text x="126" y="32"
        font-family="'Arial Black', 'Arial', sans-serif"
        font-size="26" font-weight="900"
        fill="#f5f5f5">Tweaks</text>

  <!-- Subtitle -->
  <text x="71" y="46"
        font-family="'Arial', sans-serif"
        font-size="9.5" font-weight="400"
        fill="#a0a0a0"
        letter-spacing="2.5">FORTNITE OPTIMIZER</text>

  <!-- Accent underline -->
  <line x1="71" y1="50" x2="195" y2="50" stroke="url(#gH)" stroke-width="1" opacity="0.35"/>
</svg>
