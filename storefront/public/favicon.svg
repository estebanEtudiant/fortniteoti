  <rect width="64" height="64" rx="12" fill="none" stroke="rgba(222,255,154,0.45)" stroke-width="1.5"/>
  <text x="32" y="41"
        font-family="'Arial Black', 'Arial', sans-serif"
        font-size="24" font-weight="900"
