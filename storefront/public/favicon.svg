<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00D1FF"/>
      <stop offset="100%" stop-color="#8F66FF"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="64" height="64" rx="12" fill="#0B0B0D"/>

  <!-- Subtle grid lines -->
  <line x1="0" y1="32" x2="64" y2="32" stroke="#00D1FF" stroke-width="0.3" opacity="0.15"/>
  <line x1="32" y1="0" x2="32" y2="64" stroke="#00D1FF" stroke-width="0.3" opacity="0.15"/>

  <!-- Border gradient -->
  <rect width="64" height="64" rx="12" fill="none" stroke="url(#g)" stroke-width="1.5" opacity="0.7"/>

  <!-- "404" text -->
  <text x="32" y="41"
        font-family="'Arial Black', 'Arial', sans-serif"
        font-size="24" font-weight="900"
        fill="url(#g)"
        text-anchor="middle"
        filter="url(#glow)">404</text>
</svg>
