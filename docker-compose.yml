version: '3.8'

services:
  # ── PostgreSQL ──
  postgres:
    image: postgres:16-alpine
    container_name: fn_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fn_licensing}
      POSTGRES_USER: ${POSTGRES_USER:-fn_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_in_production}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fn_admin}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ──
  redis:
    image: redis:7-alpine
    container_name: fn_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-changeme_redis}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-changeme_redis}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend API (NestJS) ──
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fn_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      TRUST_PROXY: "true"
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-fn_admin}:${POSTGRES_PASSWORD:-changeme_in_production}@postgres:5432/${POSTGRES_DB:-fn_licensing}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD:-changeme_redis}@redis:6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      HWID_SALT: ${HWID_SALT}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      ADMIN_CORS_ORIGIN: ${ADMIN_CORS_ORIGIN:-http://localhost:5173}
      STOREFRONT_CORS_ORIGIN: ${STOREFRONT_CORS_ORIGIN:-http://localhost:3002}
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./backend/storage:/app/storage

  # ── Dashboard Admin (React) ──
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${API_URL:-http://localhost:3000}
    container_name: fn_dashboard
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "127.0.0.1:5173:80"

  # ── Storefront (React — Public Client Site) ──
  storefront:
    build:
      context: ./storefront
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${API_URL:-http://localhost:3000}
    container_name: fn_storefront
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "127.0.0.1:3002:80"

volumes:
  postgres_data:
  redis_data:
